<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title><link rel="stylesheet" href="/assets/style.css"></head><body>
<script id="bootstrap" type="application/json">BOOTSTRAP</script>
<header><h1 data-ui="title"></h1><div id="language-switch" aria-label="Language"><button type="button" data-language="ja">日本語</button><button type="button" data-language="en">English</button></div></header>
<form id="login" hidden><label data-ui="password" for="password"></label><input id="password" name="password" type="password" autocomplete="current-password" required><button data-ui="login"></button></form>
<div id="admin" hidden><details id="menu" open><summary data-ui="menu"></summary><nav><button data-page="status" data-ui="status"></button><button data-page="history" data-ui="history"></button><button data-page="sender" data-ui="sender"></button><button data-page="settings" data-ui="settings"></button><button data-page="logs" data-ui="logs"></button></nav></details>
<main><p id="connection" role="status"></p><section id="status"><h2 data-ui="status"></h2><section id="links"><h3 data-ui="links"></h3><div id="cameras"></div></section><section><h3 data-ui="obs"></h3><p id="obs"></p></section><section><h3 data-ui="standby"></h3><p id="standby"></p></section><section><h3 data-ui="mediamtx"></h3><p id="mediamtx"></p></section><p id="last-error"></p><ul id="warnings"></ul><section><h3 data-ui="scenes"></h3><div id="scenes" aria-live="polite"></div></section><div id="actions"><button data-command="stream/start" data-ui="start"></button><button data-command="stream/stop" data-ui="stop"></button><button data-command="standby/on" data-ui="standby_on"></button><button data-command="standby/off" data-ui="standby_off"></button><button data-command="cameras/show-all" data-ui="show_all"></button></div></section><section id="log-panel" hidden><h2 data-ui="logs"></h2><label for="log-level" data-ui="log_level"></label><select id="log-level"><option value="INFO">INFO</option><option value="WARN">WARN</option><option value="ERROR">ERROR</option></select><pre id="log-lines" aria-live="polite"></pre></section><p id="soon" data-ui="soon" hidden></p></main></div><p id="error" role="alert"></p><script src="/assets/login.js" defer></script></body></html>
